<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ドット絵ペイント</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。CSS を足して自由に装飾できる。

      マス目の作り方: flex や grid は使わず、各マス(.pixel-cell)を inline-block で横に並べ、
      コンテナ(.pixel-canvas)の幅を「マス幅 × 16」にして自然に折り返させている。
    -->
    <style>
      body {
        background-color: #f0ece6;
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      .title {
        display: flex;
        flex-direction: column; /* 縦並びに指定 */
        align-items: center;
        margin: 10px auto;
        gap: 0;
      }

      .title h1 {
        display: inline-block; /* 文字の長さに合わせて枠を縮める */
        padding: 10px 20px;
        margin: 8px;
        background-color: #fbfbfa;
        border: 4px solid #aab1aa;
        border-radius: 8px;
        color: #8a8c8c;
        font-size: 36px;
        font-weight: bold;
        
      }

      .title p {
        text-align: center;
        font-size: 14px;
        color: #555655;
        background-color: #ffffff;
        display: inline-block;
        padding: 6px 16px;
        border-radius: 20px;
        border: 3px solid #bbc4bf;
        margin: 12px auto;
      }

      .content{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 24px;
        background-color: #ffffff;
        border: 5px solid #c7cac6;
        border-radius: 16px;
        margin: 0 auto;
        width: fit-content;
        width: 95%;          /* 画面幅に応じたサイズ */
        max-width: 600px;    /* お好みの最大幅（例: 500px〜700px） */
        box-sizing: border-box;
      }

      .grid-size-input{
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .grid-size-input input {
        padding: 4px 8px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        width: 70px;
        box-sizing: border-box;
      }
      
      .grid-size-input input:focus {
        /* ブラウザデフォルトの太枠を消す */
        outline: none;
        border: 2px solid #eeba59;
      }

      .grid-size-input label {
        font-size: 16px;
        color: #444844;
      }
      
      .grid-size-input button {
        padding: 6px 12px;
        font-size: 14px;
        background-color: #6b716a;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      /* ボタンホバー時のスタイル（カーソルを合わせた時） */
      .grid-size-input button:hover {
        background-color: #4e584e;
        transform: scale(1.05); /* 1.05倍に少し拡大する */
      }

      /* マス目コンテナ。幅 = 20px × 16マス = 320px。
      font-size: 0 は inline-block の間にできる余白(隙間)を消すため。 */
      .pixel-canvas {
        width: 320px;
        height: fit-content;
        font-size: 0;
        border: 4px solid #8f948b;
        border-radius: 4px;
        margin: 16px auto;
        flex-shrink: 0;       /* スクロール時にキャンバスが潰れないようにする */
      }

      .canvas-scroll {
        width: 100%;          /* （.content）の幅に合わせる */
        overflow: auto;     /* はみ出た部分を横スクロール可能にする */
        max-height: 400px;
        display: flex;
        justify-content: safe center;
        padding: 8px 8px;
      }

      /* 1マス。box-sizing: border-box で枠線を含めて 20px にし、ぴったり16列にする。 */
      .pixel-cell {
        display: inline-block;
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 1px solid #eee;
        background: #fff;
        cursor: pointer;
      }

      /* flexでボタンを横並びにして、centerでボタンを横一列にそろえる。 */
      .controls-container {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .clear-button {
        font-size: 14px;
        padding: 10px 14px;
        background-color: #6b716a;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      .clear-button:hover {
        background-color: #4e584e;
        transform: scale(1.05); /* 1.05倍に少し拡大する */
      }

      .color-button {
        width: 32px;
        height: 32px;
        border: 2px solid #afbda6;
        border-radius: 50%;
        margin: 0px 2px;
        cursor: pointer;
      }

      .color-button:hover {
        border: 2px solid #eeba59;
        transform: scale(1.05);
      }

      /* 選択された筆の色のボタンのスタイル */
      .color-button.paint {
        border: 3px solid #eeba59;
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <div class="title">
    <h1>ドット絵ペイント</h1>
    <p>マス目をクリックして塗ってみましょう。</p>
    </div>

    <!-- index.html など -->
    <!-- マス目の行数・列数を指定するフィールド。定義域は1<=x<=100 -->
    <div class="content">
    <div class="grid-size-input">
      <label for="rows-input">行数:</label>
      <input type="number" id="rows-input" value="16" min="1" max="100" />

      <label for="cols-input">列数:</label>
      <input type="number" id="cols-input" value="16" min="1" max="100" />

      <button id="generateBtn">マス目を生成</button>
    </div>

    <div class="canvas-scroll">
    <!-- マス目は renderGrid がここに並べる。 -->
    <div id="canvas" class="pixel-canvas"></div>
    </div>

    <div class="controls-container">
      <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
      <div class="controls">
      <button class="clear-button" id="clear-button">全消去</button>
     </div>

     <!-- カラーパレットのボタン。main.tsと結びついており、クラスが.color-buttonのボタンを呼び出す。 -->
     <div id="palette"></div>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。
        - カラーパレット → ここに色ボタンを並べる
    -->

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
</div>
