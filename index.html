<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ドット絵ペイント</title>

    <!--
      最小限の見た目だけ整えている（Tailwind は使わない）。CSS を足して自由に装飾できる。

      マス目の作り方: flex や grid は使わず、各マス(.pixel-cell)を inline-block で横に並べ、
      コンテナ(.pixel-canvas)の幅を「マス幅 × 16」にして自然に折り返させている。
    -->
    <style>
      body {
        margin: 24px;
        font-family: sans-serif;
        line-height: 1.6;
      }

      /* マス目コンテナ。幅 = 20px × 16マス = 320px。
         font-size: 0 は inline-block の間にできる余白(隙間)を消すため。 */
      .pixel-canvas {
        width: 320px;
        font-size: 0;
        border: 1px solid #999;
        margin: 16px 0;
      }

      /* 1マス。box-sizing: border-box で枠線を含めて 20px にし、ぴったり16列にする。 */
      .pixel-cell {
        display: inline-block;
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 1px solid #eee;
        background: #fff;
        cursor: pointer;
      }

      /* flexでボタンを横並びにして、centerでボタンを横一列にそろえる。 */
      .controls-container {
        display: flex;
        align-items: center;
      }

      .controls button {
        padding: 8px 16px;
        font-size: 16px;
        cursor: pointer;
      }

      .color-button {
        width: 32px;
        height: 32px;
        border: 2px solid #cccccc;
        margin: 0px 2px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <h1>ドット絵ペイント</h1>
    <p>マス目をクリックして塗ってみましょう。</p>

    <!-- index.html など -->
    <!-- マス目の行数・列数を指定するフィールド。定義域は1<=x<=100 -->
    <div class="grid-size-input">
      <label for="rows-input">行数:</label>
      <input type="number" id="rows-input" value="16" min="1" max="100" />

      <label for="cols-input">列数:</label>
      <input type="number" id="cols-input" value="16" min="1" max="100" />

      <button id="generateBtn">マス目を生成</button>
    </div>

    <!-- マス目は renderGrid がここに並べる。 -->
    <div id="canvas" class="pixel-canvas"></div>

    <div class="controls-container">
      <!-- 操作ボタン。クリック時の処理は main.ts で結びつけている。 -->
      <div class="controls">
      <button id="clear-button">全消去</button>
     </div>

     <!-- カラーパレットのボタン。main.tsと結びついており、クラスが.color-buttonのボタンを呼び出す。 -->
     <div id="palette"></div>
    </div>

    <!--
      拡張ポイント（ステップ2以降で使う空きエリア）。
        - カラーパレット → ここに色ボタンを並べる
    -->

    <!-- TypeScript を読み込む（Vite が変換する）。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
